name: Update stats

on:
  schedule:
    - cron: "0 11 * * *" # every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "TEMPLATE.md"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if USER_TOKEN secret is configured (required for GitHub GraphQL viewer queries)
    if: "${{ secrets.USER_TOKEN != '' }}"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate README.md
        uses: orhun/profile-readme-stats@master
        with:
          token: ${{ secrets.USER_TOKEN }}
          lifetimeStreak: true
      - name: Update README.md
        shell: bash
        run: |
          if [[ "$(git status --porcelain)" != "" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(stats): update profile stats [skip ci]"
            git push
          fi
